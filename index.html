<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20/10 - 8B Galaxy Hồng Premium</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="stars-bg"></div>
    <div id="mouse-trail-container"></div>
    <div id="rain-container"></div>

    <!-- Thanh điều chỉnh âm lượng nhạc nền -->
    <div id="audio-controls" class="glass-box fade-in">
        <span id="audio-icon">🔊</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3">
    </div>

    <!-- Màn hình chính -->
    <main id="home-view" class="view fade-in">
        <div class="header">
            <h1 class="glowing-text">✨ 8B Women's Day ✨</h1>
            <p class="subtitle">Vũ trụ thiên hà ngập tràn yêu thương</p>
        </div>
        
        <div id="teacher-section"></div>
        <div id="students-grid" class="grid"></div>
    </main>

    <!-- Màn hình chi tiết -->
    <section id="detail-view" class="view hidden">
        <button id="btn-exit" class="btn-close glass-box">✖</button>
        <div class="content-wrapper">
            <div id="emoji-display" class="float-heavy glowing-text"></div>
            <div id="wish-box" class="glass-box hidden pop-in">
                <p id="wish-text"></p>
                <!-- Nút nghe lại voice MP3 riêng -->
                <button id="btn-replay-voice" class="btn-voice">🔊 Nghe lại giọng đọc</button>
            </div>
        </div>
    </section>

    <!-- Nhạc nền và Audio phát voice riêng biệt -->
    <audio id="bg-music" src="./music/music.mp3" loop></audio>
    <audio id="voice-player"></audio>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
